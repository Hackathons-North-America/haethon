packages:
  - 'components/*'
  - 'apps/*'      # Add this if you have an apps folder
  - 'packages/*'  # Add this if you have a packages folder

overrides:
  '@posthog/browser-common': 0.2.1
  'brace-expansion@>=4.0.0 <5.0.11': 5.0.13
  effect: 3.22.5
  fast-uri: 3.1.9
  sharp: 0.35.5
  postcss: 8.5.19
  'nanoid@<3.3.18': 3.3.20
  'source-map-js@>=1.0.0 <1.2.2': 1.2.4
  'undici@>=4.0.0 <6.29.1': 6.29.1

allowBuilds:
  '@clerk/shared': true
  '@sentry/cli': true
  core-js: true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
